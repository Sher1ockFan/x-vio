%YAML:1.0
# calibrate_nx/fit/fit_03, run_02. Source CamChain and IMU YAML are in calibration_60/.
# Native Omni-radtan at 1920x1536. Use all original image rows and no processing resize.
File.version: "1.0"
Camera.calibrationStatus: "calibrated_omni_candidate"
Camera.type: "OmniRadtan"
Camera1.fx: 1494.2722516274534
Camera1.fy: 1495.4468158582101
Camera1.cx: 972.4542797992651
Camera1.cy: 789.0899264198501
Camera1.xi: 1.9121509749083578
Camera1.k1: 0.9066884402718393
Camera1.k2: -1.2465373776904145
Camera1.p1: -3.364740959810424e-05
Camera1.p2: 0.0007388408566274154
Camera.width: 1920
Camera.height: 1536
Camera.fps: 60
Camera.RGB: 0
# Kalibr T_cam_imu is inverted to map camera coordinates to the IMU.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.9997519629431524, -0.00961582966096581, -0.020088514411117652, -0.003052958448286533,
          0.02013098348424117, 0.004340344678592352, 0.9997879299691655, 0.019296657573496127,
          -0.009526599355047988, -0.9999443470653769, 0.004532844220364769, 0.01981436311959976,
          0.0, 0.0, 0.0, 1.0]
# Noise densities and random walks were carried through the fit as provisional priors.
IMU.NoiseGyro: 0.000116355283466
IMU.NoiseAcc: 0.000666666666667
IMU.GyroWalk: 1e-06
IMU.AccWalk: 2e-05
IMU.Frequency: 500.0
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
