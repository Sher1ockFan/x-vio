%YAML:1.0
# fit_05 / run_03, verified against independent run_04. IMU_MONOCULAR.
# Input: unrotated 1920x1440 Y pixels after removing the metadata row. Live: 30 fps.
# Before TrackMonocular apply +0.016881056522098987 s ONCE to the mapped camera time.
# Use the clock conventions in timing.json.
File.version: "1.0"
Camera.type: "KannalaBrandt8"
Camera1.fx: 448.29128603612367
Camera1.fy: 447.8671862373578
Camera1.cx: 961.0571170986485
Camera1.cy: 717.5117388590763
Camera1.k1: 0.21836372495045944
Camera1.k2: -0.05933403743095892
Camera1.k3: 0.008485453727516598
Camera1.k4: -0.0008888521529517888
Camera.width: 1920
Camera.height: 1440
Camera.fps: 30
Camera.RGB: 0

# Camera coordinates to the configured IMU output axes; translation in metres.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.999741270430994, 0.00796214066832993, -0.0213071939260198, 0.00158744070191347,
          0.0212122426228454, -0.0118253547448793, -0.999705057378459, -0.0146710347704421,
          -0.00821175742048125, -0.999898377487, 0.011653400316289, 0.0239608057868008,
          0, 0, 0, 1]
# Data-sheet proxies for white noise, exploratory priors for bias random walks.
IMU.NoiseGyro: 0.000116355283466
IMU.NoiseAcc: 0.000666666666667
IMU.GyroWalk: 1.0e-6
IMU.AccWalk: 2.0e-5
IMU.Frequency: 500.0

# Initial feature and viewer settings based on the upstream monocular-inertial example.
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

# Native ORB resize with half-pixel compensation in Camera1.cx/cy.
Camera.newWidth: 960
Camera.newHeight: 720
